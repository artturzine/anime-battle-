<style>
*{box-sizing:border-box}
:root{
 --bg:#08090f;--panel:#11131d;--panel2:#181b28;--line:#2b3042;
 --text:#f5f7ff;--muted:#9da5bd;--accent:#7c5cff;--green:#34d399;
}
body{margin:0;background:radial-gradient(circle at top,#17152b 0,#08090f 42%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}

#app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}
header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:24px;letter-spacing:1px}
.logo span{color:#8d73ff}
.coins{background:#171a26;border:1px solid var(--line);padding:8px 12px;border-radius:14px;font-weight:800}
.screen{padding:14px 16px}
.card{background:rgba(17,19,29,.94);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px #0004}
h1,h2,h3,p{margin-top:0}
h1{font-size:28px;margin-bottom:6px}
h2{font-size:21px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menuBtn,.bigBtn{padding:18px;border-radius:17px;background:linear-gradient(135deg,#242039,#171927);border:1px solid var(--line);font-weight:800;text-align:left}
.bigBtn{width:100%;text-align:center;background:linear-gradient(135deg,#795dff,#4e36c7);margin-top:8px}
.smallBtn{padding:10px 13px;border-radius:12px;background:#24283a;border:1px solid var(--line)}
.danger{background:#4b202b}
.roulette{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.orb{width:115px;height:115px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle,#fff,#a996ff 20%,#5137c9 55%,#151024 72%);box-shadow:0 0 55px #765dff99;margin-bottom:16px}
.resultName{font-size:27px;font-weight:900}
.rarity{font-weight:900;margin:6px 0 14px}
.comum{color:#9aa0ad}.incomum{color:#4ea7ff}.raro{color:#b16cff}.epico{color:#ffd84d}.lendario{color:#ff6262}.mitico{color:#ddd}
.list{display:grid;gap:9px}
.item{display:flex;align-items:center;justify-content:space-between;background:#151824;border:1px solid var(--line);padding:12px;border-radius:14px}
.badge{font-size:12px;padding:5px 8px;border-radius:8px;background:#25293a}
.charCard{padding:14px;border-radius:16px;border:1px solid var(--line);background:#151824}
.charTop{display:flex;justify-content:space-between;gap:10px}

.navin{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}

nav button.active{color:#fff}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0d0f17;color:white;outline:none;margin:6px 0 10px}
.back{margin-bottom:12px}
.hidden{display:none}

.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#202437;border:1px solid var(--line);padding:12px 16px;border-radius:13px;z-index:20;opacity:0;pointer-events:none;transition:.25s}

.fighter{text-align:center;position:relative;min-height:205px}
.fighterName{font-weight:900;font-size:16px;margin-bottom:8px;min-height:20px}

.orbMax{font-size:11px;color:#d9dded;margin-top:2px}

.effect.show{animation:hitEffect .62s ease-out}

.effect.blood.show{animation:bloodEffect .6s ease-out}
.effect.energy.show{animation:energyEffect .6s ease-out}

};

if(typeof state.freeSpinUsed!=='boolean') state.freeSpinUsed=false;
if(!state.wins) state.wins={easy:0,medium:0,hard:0};
function save(){localStorage.setItem('animeBattleV1',JSON.stringify(state));updateCoins()}
function updateCoins(){let e=document.getElementById('coins');if(e)e.textContent=state.coins}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function go(page){render(page)}
function rarityWeight(){let r=Math.random()*100,s=0;for(const x of rarities){s+=x.chance;if(r<s)return x.id}}
function pickChar(r){let pool=chars.filter(c=>c.rarity===r);return pool[Math.floor(Math.random()*pool.length)]}
function addObtained(c){let old=state.inventory[c.id]||0;state.inventory[c.id]=old+1;if(old>=1){state.coins++;return true}if(!state.selected)state.selected=c.id;return false}
function spin(){
 if(!state.freeSpinUsed){state.freeSpinUsed=true;let c=pickChar(rarityWeight()),dup=addObtained(c);save();showResult(c,dup,true);return}
 if(state.coins<3){toast('Você precisa de 3 moedas!');return}
 state.coins-=3;let c=pickChar(rarityWeight()),dup=addObtained(c);save();showResult(c,dup,false)
}
function tenSpin(){
 if(state.coins<30){toast('Você precisa de 30 moedas!');return}
 state.coins-=30;let results=[];
 for(let i=0;i<10;i++)results.push(pickChar(rarityWeight()));
 if(!results.some(c=>['epico','lendario','mitico'].includes(c.rarity)))results[0]=pickChar('epico');
 let dup=0;results.forEach(c=>{if(addObtained(c))dup++});save();showMulti(results,10,dup)
}
function hundredSpin(){
 if(state.coins<300){toast('Você precisa de 300 moedas!');return}
 state.coins-=300;let results=[];
 for(let i=0;i<100;i++)results.push(pickChar(rarityWeight()));
 if(!results.some(c=>['epico','lendario','mitico'].includes(c.rarity)))results[Math.floor(Math.random()*100)]=pickChar('epico');
 let dup=0;results.forEach(c=>{if(addObtained(c))dup++});save();showMulti(results,100,dup)
}

 else if(n.includes('garra'))html='<div class="techClaw">🖐️</div>';
 else if(/fogo|brasa|vulcão|meteoro/.test(n))html='<div class="techBurst fire"></div><div class="techProjectile">🔥</div>';
 else if(/gelo|água|congel/.test(n))html='<div class="techBurst ice"></div><div class="techProjectile">❄️</div>';
 else if(/raio|eletric|descarga/.test(n))html='<div class="techLightning">⚡</div>';
 else if(/sangue|perfuração|supernova|ferrão|ferroada/.test(n))html='<div class="techSlash blood">🩸</div>';
 else if(/maldição|veneno|alma|transfiguração|polimorfismo/.test(n))html='<div class="techSmoke">☠️</div>';
 else if(/sombra|adaptação|mah[oó]raga/.test(n))html='<div class="techWheel">◉</div>';
 else if(/barreira|cortina|domínio/.test(n))html='<div class="techShield blue"></div>';
 else if(/rika|amor|manifestação/.test(n))html='<div class="techHeart">♥</div>';
 else html='<div class="techImpact">✦</div>';
 field.innerHTML=html;let anim=field.firstElementChild;if(anim){void anim.offsetWidth;anim.classList.add('go')}
 orb.classList.remove('shake');void orb.offsetWidth;orb.classList.add('shake');let fl=orb.querySelector('.damageFloat');if(side==='enemy'&&damage>0){fl.textContent=(critical?'PERFEITO! ':'-')+damage;fl.className='damageFloat';void fl.offsetWidth;fl.classList.add('show')}
 setTimeout(()=>{field.innerHTML=''},1000);
}

let onlineSocket=null,onlineRoom=null,onlineToken=localStorage.getItem('animeBattleOnlineToken')||'',onlineState=null;
let onlineClockTimer=null;
function startOnlineClock(){clearInterval(onlineClockTimer);onlineClockTimer=setInterval(()=>{if(onlineState&&onlineState.phase==='turn'&&typeof onlineState.timeLeft==='number'){onlineState.timeLeft=Math.max(0,onlineState.timeLeft-1);if(document.querySelector('.screen')&&document.querySelector('.screen').textContent.includes(onlineState.room))onlineDrawBattle();}},1000)}
function onlineUrl(){if(location.protocol==='file:')return 'ws://localhost:8080';return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'}
function onlineConnect(cb){if(onlineSocket&&onlineSocket.readyState===WebSocket.OPEN){cb&&cb();return}try{onlineSocket=new WebSocket(onlineUrl())}catch(e){toast('Não foi possível abrir o online.');return}onlineSocket.onopen=()=>{setOnlineStatus('🟢 Conectado ao servidor');cb&&cb()};onlineSocket.onclose=()=>{setOnlineStatus('🔴 Desconectado. Tentando reconectar...');if(onlineRoom)setTimeout(()=>onlineConnect(()=>onlineSend({type:'reconnect',room:onlineRoom,token:onlineToken})),1500)};onlineSocket.onerror=()=>setOnlineStatus('🟠 Erro de conexão');onlineSocket.onmessage=e=>{try{handleOnlineMessage(JSON.parse(e.data))}catch(err){console.error(err)}}}
function onlineSend(x){if(onlineSocket&&onlineSocket.readyState===WebSocket.OPEN)onlineSocket.send(JSON.stringify(x));else toast('Conectando ao servidor...')}
function setOnlineStatus(t){let e=document.getElementById('onlineStatus');if(e)e.textContent=t}
function createRoom(){let mode=document.getElementById('onlineMode')?.value||'1v1';onlineConnect(()=>onlineSend({type:'create',nickname:state.nickname||'Jogador',mode,character:state.selected||currentChar()?.id||'yuji'}))}
function joinRoom(){let code=(document.getElementById('room')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('O código precisa ter 6 caracteres.');return}onlineConnect(()=>onlineSend({type:'join',room:code,nickname:state.nickname||'Jogador',character:state.selected||currentChar()?.id||'yuji'}))}
function renderOnlineLobby(){let r=onlineState;if(!r)return;document.getElementById('screen').innerHTML=`<div class="screen"><div class="card"><h2>🏠 Sala ${r.room}</h2><p class="muted">Modo: ${r.mode} • ${r.players.length}/${r.maxPlayers} jogadores</p><h1 style="text-align:center;letter-spacing:7px">${r.room}</h1><div class="list">${r.players.map((p,i)=>`<div class="item"><span>${i===0?'👑 ':''}${p.nickname}</span><span>${p.characterName||p.character||'Escolhendo...'}</span></div>`).join('')}</div>${r.isHost?'<button class="bigBtn" onclick="onlineStart()">▶️ Iniciar partida</button>':'<p class="muted" style="text-align:center">Aguardando o líder iniciar...</p>'}<button class="smallBtn" onclick="onlineLeave()">Sair da sala</button><div class="log">🟢 Conectado. Se a conexão cair, a sala pode ser recuperada pelo token.</div></div></div>`}
function onlineStart(){onlineSend({type:'start'})}
function onlineLeave(){onlineSend({type:'leave'});onlineRoom=null;onlineState=null;go('play')}
function handleOnlineMessage(m){if(m.type==='error'){toast(m.message||'Erro');return}if(m.type==='welcome'){onlineToken=m.token;localStorage.setItem('animeBattleOnlineToken',onlineToken);onlineRoom=m.room;return}if(m.type==='lobby'){onlineRoom=m.room;onlineState=m;renderOnlineLobby();return}if(m.type==='battle'){onlineRoom=m.room;onlineState=m;startOnlineClock();onlineDrawBattle();return}if(m.type==='event'){toast(m.message);return}if(m.type==='ended'){onlineState=m;clearInterval(onlineClockTimer);onlineDrawBattle(true);return}if(m.type==='ping')onlineSend({type:'pong'})}
function onlineDrawBattle(ended=false){let b=onlineState;if(!b)return;let me=b.players.find(p=>p.selfToken)||b.me;let enemy=b.players.find(p=>!p.selfToken);if(!me)return;let skills=(me.skills||[]).map((sk,i)=>`<div class="skillCard"><button class="skillBtn" onclick="onlineSkill(${i})" ${b.turnResolved||me.cooldowns?.[i]>0||b.phase!=='turn'?'disabled':''}>⚔️ ${sk.name} <span style="float:right">${sk.damage} DMG</span><br><small class="muted">CD ${me.cooldowns?.[i]||0} • ${sk.description||''}</small></button></div>`).join('');let result=ended?`<div class="card" style="text-align:center"><h1>${b.winnerToken===onlineToken?'🎉 Vitória!':'💀 Derrota!'}</h1><p>${b.endReason||'Partida encerrada.'}</p><button class="bigBtn" onclick="go('online')">Voltar ao Online</button></div>`:'';document.getElementById('screen').innerHTML=`<div class="screen"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>🌐 ${b.room}</b><span>Turno ${b.turn||1} • ⏱️ ${b.timeLeft??12}s</span></div><div class="battleArena"><div class="fighter"><div class="fighterName">${me.nickname}</div><div class="fighterOrb"><div><div class="orbHp">${Math.max(0,me.hp)} HP</div><div class="orbMax">${me.maxHp} HP</div></div></div></div><div class="fighter"><div class="fighterName">${enemy?.nickname||'Oponente'}</div><div class="fighterOrb enemyOrb"><div><div class="orbHp">${Math.max(0,enemy?.hp||0)} HP</div><div class="orbMax">${enemy?.maxHp||0} HP</div></div></div></div></div><div class="list">${skills}</div><button class="bigBtn" style="background:#24283a" onclick="onlineSkip()" ${b.phase!=='turn'||b.turnResolved?'disabled':''}>⏭️ Pular turno</button><div class="log">${b.phase==='turn'?(me.actionSubmitted?'✅ Ação enviada. Aguardando oponente...':'Escolha sua ação. As duas ações são resolvidas juntas.'):'Aguardando...'}</div>${result}</div></div>`}
function onlineSkill(i){onlineSend({type:'action',action:'skill',skill:i,quality:Math.random()<.18?2:1})}
function onlineSkip(){onlineSend({type:'action',action:'skip'})}

function redeem(){let code=document.getElementById('code').value.trim().toUpperCase();if(code.length!==5){toast('O código precisa ter 5 caracteres.');return}if(state.codeUsed.includes(code)){toast('Código já usado.');return}const rewards={START:'coins',JJK01:'yuji',GOJO1:'gojo',SUKNA:'sukuna'};if(code==='JUNIN'){state.coins+=1000}else if(code==='JHON'||code==='TUTUT'){chars.forEach(c=>state.inventory[c.id]=10);state.selected=state.selected||chars[0].id}else if(code==='START'){state.coins+=5}else if(rewards[code]&&rewards[code]!=='coins'){let c=chars.find(x=>x.id===rewards[code]);addObtained(c)}else{toast('Código inválido.');return}state.codeUsed.push(code);save();toast((code==='JHON'||code==='TUTUT')?'Todos os personagens estão no nível máximo!':code==='JUNIN'?'+1000 moedas!':'Código resgatado!')}
render('home');

</script>
